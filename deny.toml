# Supply-chain policy, enforced by `cargo deny check` in CI.
#
# Limpid ships a binary that polkit elevates to root. What it is built from is
# part of the safety model, not housekeeping: a dependency is code that runs
# with whatever authority the program has.

[graph]
# Linux is the only platform Limpid builds for, on the two architectures the
# PKGBUILD lists. Without this, the Windows and macOS halves of winit and wgpu
# are counted too, and an advisory or a licence on a crate that is never
# compiled here would block a change that cannot reach it.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# A yanked release was pulled for a reason, and that reason is rarely
# published alongside it.
yanked = "deny"
# Vulnerabilities, unsound crates and unmaintained ones all fail the check.
# Each exception below is reachable only through the GUI toolkit, has no
# maintained release to move to, and is to be revisited when Iced updates.
# The weekly scheduled run is what notices a new one without a pull request.
ignore = [
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained. Reached only through iced 0.14's SVG rendering (iced_tiny_skia, iced_wgpu -> resvg -> usvg), with no maintained release to move to." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained. Reached only through iced 0.14's font stack, with no maintained release to move to." },
]

[licenses]
# Permissive licences, plus MPL-2.0, which is file-level copyleft and asks
# only that the MPL-licensed files themselves stay available — true of
# anything on crates.io. Several dependencies are dual-licensed with a GPL or
# LGPL arm; cargo-deny takes the permissive one, and this list is what makes
# sure one is always there to take.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Iced's dependency tree carries several versions of the same crates, and
# none of it is Limpid's to choose. Denying duplicates would block every
# update; warning keeps them visible.
multiple-versions = "warn"
# A `*` version requirement takes whatever is newest on the day of the build.
# The workspace's own path dependencies are exempt: they are never published,
# so there is nothing for a version to select between.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything comes from crates.io. A git dependency or a second registry is a
# decision, and has to be made here, deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
