[tasks.build]
description = "Build every crate in release mode"
run = "cargo build --release --workspace"

[tasks.check]
description = "fmt, clippy with warnings denied, and the tests"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo test --workspace --all-features",
]

[tasks.clean]
description = "Remove the build output"
run = "cargo clean"
