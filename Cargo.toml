# The application is the root package, and the libraries are workspace
# members. Not just tidiness: release-please's Rust support needs the
# configured package path to be a real manifest, and a virtual workspace at
# the root gives it nothing to update or to derive a version from.
[package]
name = "limpid"
description = "A system cleaner and disk-space analyser for Linux"
version = "0.4.0"
edition = "2024"
rust-version.workspace = true
publish.workspace = true
license = "MIT"
repository = "https://github.com/heroesofcode/limpid"
homepage = "https://github.com/heroesofcode/limpid"
authors = ["Pedro Henrique <13969802+pedrohfp@users.noreply.github.com>"]
readme = "README.md"

[[bin]]
name = "limpid"
path = "src/main.rs"

[dependencies]
limpid-core.workspace = true
limpid-theme.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tokio ={ version = "1", features = ["rt", "time"] }
zbus = "5.11"
iced = { version = "0.14", features = ["canvas", "tokio", "svg", "advanced"] }

[dev-dependencies]
tempfile = "3.24"

[workspace]
resolver = "3"
members = [
    "crates/limpid-core",
    "crates/limpid-theme",
    "crates/limpid-cli",
    "crates/limpid-helper",
]

[workspace.package]
edition = "2024"
# The oldest compiler the dependency tree builds with, not the oldest that
# understands edition 2024: Iced 0.14 and wgpu 27 need 1.88. CI checks this
# with that exact toolchain, so it cannot drift back into a promise.
rust-version = "1.88"
# Nothing here goes to crates.io. Saying so stops an accidental
# `cargo publish`, and is what lets cargo-deny accept the path dependencies
# between these crates without a version.
publish = false
license = "MIT"
repository = "https://github.com/heroesofcode/limpid"
homepage = "https://github.com/heroesofcode/limpid"
authors = ["Pedro Henrique <13969802+pedrohfp@users.noreply.github.com>"]

[workspace.dependencies]
# No `version` on these. They are path dependencies of crates that are never
# published, so a version requirement buys nothing and has to be kept in step
# by hand — release-please bumps the packages and the lock but not this, so
# the first release would have left `^0.1.0` pointing at 0.2.0 and the
# workspace would not resolve at all.
limpid-core = { path = "crates/limpid-core" }
limpid-theme = { path = "crates/limpid-theme" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Lints every crate inherits, so that a new one cannot forget them. `make
# check` and CI deny warnings, so `warn` here still fails the build there; it
# only keeps a local `cargo build` usable while something is half-written.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Leftovers from a debugging session.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A cleaner that panics halfway through a plan has carried out part of it.
# Tests may unwrap; clippy.toml says so.
unwrap_used = "warn"
panic = "warn"
# Slicing a string by byte offset panics inside a multi-byte character, and
# what Limpid reads — file names, theme files — was written by someone else.
string_slice = "warn"
# An exception to a lint says why, the same as any other comment here.
allow_attributes_without_reason = "warn"
# Removing files, resolving symlinks and spawning processes are confined to
# the places allowed to do them. The list, and the reasons, are in
# clippy.toml.
disallowed_methods = "deny"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
