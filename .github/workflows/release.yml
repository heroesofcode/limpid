name: release

# release-please publishes the release; this attaches binaries to it. Keyed
# on `published` rather than on the tag, so a release created by hand gets
# them too.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libvulkan-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="limpid-${version}-x86_64-linux"
          mkdir -p "$staging"
          cp target/release/limpid target/release/limpid-cli "$staging/"
          cp target/release/limpid-helper "$staging/"
          cp -r data README.md LICENSE Makefile "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" limpid-*.tar.gz limpid-*.sha256 --clobber
