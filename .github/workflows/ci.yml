name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      # Build dependencies for the Iced front-end: wgpu needs a Vulkan loader,
      # and winit needs the Wayland and X11 client libraries even to link.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libvulkan-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01

      # The same command as locally, so the two cannot drift apart.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Check
        run: mise run check

      - name: Build release
        run: cargo build --workspace --release
