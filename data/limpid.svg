<?xml version="1.0" encoding="UTF-8"?>
<!--
  The mark is the application's own gauge: an open ring, read clockwise from
  twelve, with the gap where the unreclaimed part would be. It has to survive
  being drawn at 16 pixels, so there is nothing in it but the ring and the
  plate it sits on.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d222a"/>
      <stop offset="1" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9fd0"/>
      <stop offset="1" stop-color="#7cc8e8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#plate)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- The track, faint enough to read as a groove rather than a second value. -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#7f8a99" stroke-opacity="0.22"
          stroke-width="7"/>

  <!-- Roughly three quarters, swept clockwise from twelve o'clock. -->
  <path d="M 32 14 A 18 18 0 1 1 14 32" fill="none" stroke="url(#arc)"
        stroke-width="7" stroke-linecap="round"/>
</svg>
