[package]
name = "limpid-gui"
description = "Limpid, a system cleaner for Linux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "limpid"
path = "src/main.rs"

[dependencies]
limpid-core.workspace = true
limpid-theme.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tokio = { version = "1", features = ["rt", "time"] }
iced = { version = "0.14", features = ["canvas", "tokio", "svg", "advanced"] }
